name: app

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: lilyan
      POSTGRES_PASSWORD: lilyan_dev_pw
      POSTGRES_DB: lilyan
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilyan -d lilyan"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  api:
    image: node:22
    restart: on-failure
    working_dir: /workspace/server
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - api_node_modules:/workspace/server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgres://lilyan:lilyan_dev_pw@db:5432/lilyan
      - PUBLIC_BASE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PREVIEW_MODE
      - SESSION_TTL_DAYS=30
    env_file:
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npx nodemon --legacy-watch --watch src --ext js,sql --delay 400ms src/index.js
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: node:22
    restart: on-failure
    working_dir: /workspace/client
    volumes:
      - ${BASE44_PROJECT_ROOT}:/workspace
      - web_node_modules:/workspace/client/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:5173"
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npm run dev
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
